<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reserva de Salas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 2rem;
            background: #f5f7fb;
        }

        .card {
            max-width: 520px;
            background: white;
            padding: 1.25rem;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 0.65rem 0 0.35rem;
            font-weight: 600;
        }

        input,
        select,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 0.65rem;
            border-radius: 8px;
            border: 1px solid #d2d8e6;
            font-size: 1rem;
        }

        button {
            margin-top: 1rem;
            border: 0;
            background: #1f6feb;
            color: #fff;
            cursor: pointer;
        }

        #msg {
            margin-top: 1rem;
            font-weight: 600;
        }

        ul {
            margin-top: 0.75rem;
            padding-left: 1.2rem;
        }
    </style>
</head>
<body>
<div class="card">
    <h2>Reservar Sala</h2>
    <p>Disponível de segunda a sábado, das 07:00 às 21:00.</p>

    <form id="form">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Seu nome" required />

        <label for="sala">Sala</label>
        <select id="sala" required>
            <option value="1">Sala 1</option>
            <option value="2">Sala 2</option>
            <option value="3">Sala 3</option>
            <option value="4">Sala 4</option>
        </select>

        <label for="data">Data</label>
        <input type="date" id="data" required />

        <label for="horario">Horário</label>
        <input type="time" id="horario" min="07:00" max="21:00" step="3600" required />

        <button type="submit">Reservar</button>
    </form>

    <p id="msg"></p>
    <h3>Reservas já feitas</h3>
    <ul id="lista-reservas"></ul>
</div>

<script>
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const lista = document.getElementById('lista-reservas');

async function carregarReservas() {
    const resposta = await fetch('/reservas');
    const reservas = await resposta.json();

    lista.innerHTML = '';

    if (reservas.length === 0) {
        const item = document.createElement('li');
        item.textContent = 'Nenhuma reserva cadastrada.';
        lista.appendChild(item);
        return;
    }

    reservas.forEach((r) => {
        const item = document.createElement('li');
        item.textContent = `${r.data} ${r.horario} - Sala ${r.sala} (${r.nome})`;
        lista.appendChild(item);
    });
}

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const nome = document.getElementById('nome').value.trim();
    const sala = document.getElementById('sala').value;
    const data = document.getElementById('data').value;
    const horario = document.getElementById('horario').value;

    const check = await fetch('/verificar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sala, data, horario })
    });

    const result = await check.json();

    if (!result.disponivel) {
        msg.innerText = `❌ ${result.motivo || 'Horário já ocupado!'}`;
        return;
    }

    const reserva = await fetch('/reservar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, sala, data, horario })
    });

    const reservaResultado = await reserva.json();

    if (reserva.ok) {
        msg.innerText = '✅ Reserva feita!';
        form.reset();
        await carregarReservas();
    } else {
        msg.innerText = `❌ ${reservaResultado.erro || 'Erro ao reservar.'}`;
    }
});

carregarReservas();
</script>
</body>
</html>
